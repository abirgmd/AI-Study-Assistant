[project]
name = "ai-study-assistant-service"
version = "1.0.0"
description = "Service IA (RAG et classification) de l'application AI Study Assistant"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests qui chargent de vrais modèles (désactivés par défaut en CI)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.coverage.run]
source = ["app"]
